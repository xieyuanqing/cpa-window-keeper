<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>5 小时自动开窗</title>
<style>
:root{
  --accent:var(--primary-color,#0a84ff);
  --ink:var(--text-primary,#111827);
  --ink2:var(--text-secondary,#4b5563);
  --ink3:var(--text-tertiary,#8e8e93);
  --surface:var(--app-surface,#ffffff);
  --page:var(--app-bg,#eef1f7);
  --hair:var(--border-color,rgba(60,60,67,.12));
  --good:#30d158;--warn:#ff9f0a;--bad:#ff453a;--idle:#8e8e93;
  --radius:24px;--radius-sm:16px;
  --glass:color-mix(in srgb,var(--surface) 66%,transparent);
  --glass-2:color-mix(in srgb,var(--surface) 44%,transparent);
  --stroke:color-mix(in srgb,var(--surface) 70%,transparent);
  --shadow:0 10px 34px rgba(15,23,42,.10),0 1px 0 rgba(255,255,255,.6) inset;
  --tint:color-mix(in srgb,var(--accent) 14%,transparent);
  color-scheme:light dark;
}
html.theme-dark,:root[data-theme='dark']{
  --shadow:0 12px 40px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.06) inset;
  --stroke:color-mix(in srgb,var(--surface) 60%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  color:var(--ink);background:var(--page);
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
  position:relative;overflow-x:hidden;
}
body::before,body::after{content:'';position:fixed;z-index:0;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
body::before{width:60vw;height:60vw;max-width:520px;max-height:520px;top:-16vw;right:-14vw;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 82%,transparent),transparent 70%)}
body::after{width:66vw;height:66vw;max-width:560px;max-height:560px;bottom:-22vw;left:-18vw;background:radial-gradient(circle at 70% 70%,color-mix(in srgb,#ff375f 62%,transparent),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto}
.card{
  background:var(--glass);border:.5px solid var(--stroke);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
}
.hero{padding:4px 2px 16px}
.hero-top{display:flex;align-items:center;gap:14px}
.app-icon{
  width:56px;height:56px;flex:0 0 56px;border-radius:18px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 92%,#fff),color-mix(in srgb,var(--accent) 60%,#7c3aed));
  color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent),0 1px 0 rgba(255,255,255,.45) inset;
}
h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.6px}
.sub{margin:3px 0 0;font-size:13.5px;color:var(--ink3);font-weight:400}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;align-items:center}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--tint);color:color-mix(in srgb,var(--accent) 78%,var(--ink));
  border:.5px solid color-mix(in srgb,var(--accent) 26%,transparent);
}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.plain{background:color-mix(in srgb,var(--ink3) 16%,transparent);color:var(--ink2);border-color:transparent}
.pill.plain::before{display:none}
.btn{
  -webkit-appearance:none;appearance:none;font:600 14.5px/1 inherit;color:var(--ink);cursor:pointer;
  padding:11px 17px;border-radius:14px;border:.5px solid var(--hair);
  background:color-mix(in srgb,var(--surface) 55%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s ease,opacity .18s ease;
}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn:active{transform:scale(.96);opacity:.9}
.btn:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.manual{margin-top:14px;padding:15px;border-radius:var(--radius-sm);background:var(--glass-2);border:.5px solid var(--stroke)}
.manual p{margin:0 0 11px;font-size:13px;color:var(--ink3)}
.row{display:flex;gap:9px;flex-wrap:wrap}
input[type=password]{
  flex:1 1 220px;min-width:0;font:400 15px/1.3 inherit;color:var(--ink);
  padding:12px 14px;border-radius:14px;border:.5px solid var(--hair);
  background:color-mix(in srgb,var(--surface) 70%,transparent);
}
input[type=password]::placeholder{color:var(--ink3)}
input[type=password]:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:transparent}
.note{margin-top:12px;font-size:13px;color:var(--ink3);min-height:0}
.note:empty{display:none}
.warn{color:var(--warn);font-weight:500}
.summary{margin-bottom:16px;font-size:14px;color:var(--ink2)}
.accounts{display:grid;gap:14px}
@media(min-width:700px){.accounts{grid-template-columns:1fr 1fr}}
.acct{display:flex;flex-direction:column;gap:13px}
.acct-head{display:flex;align-items:center;gap:12px}
.glyph{
  width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;
  font:700 16px/1 inherit;color:#fff;letter-spacing:-.3px;
  background:linear-gradient(150deg,#ff9f0a,#ff375f);box-shadow:0 6px 16px rgba(255,55,95,.28)
}
.acct[data-provider='codex'] .glyph{background:linear-gradient(150deg,#64d2ff,#0a84ff);box-shadow:0 6px 16px rgba(10,132,255,.28)}
.acct[data-provider='claude'] .glyph{background:linear-gradient(150deg,#ffb27a,#e07b39);box-shadow:0 6px 16px rgba(224,123,57,.28)}
.acct-title{min-width:0;flex:1}
.acct h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.2px;text-transform:capitalize}
.acct-id{display:block;font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink3)}
.tag{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;white-space:nowrap;
  background:color-mix(in srgb,var(--idle) 18%,transparent);color:var(--ink2)
}
.tag[data-tone='good']{background:color-mix(in srgb,var(--good) 20%,transparent);color:color-mix(in srgb,var(--good) 82%,var(--ink))}
.tag[data-tone='info']{background:var(--tint);color:color-mix(in srgb,var(--accent) 80%,var(--ink))}
.tag[data-tone='warn']{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 82%,var(--ink))}
.tag[data-tone='bad']{background:color-mix(in srgb,var(--bad) 20%,transparent);color:color-mix(in srgb,var(--bad) 80%,var(--ink))}
.meter{height:9px;border-radius:999px;background:color-mix(in srgb,var(--ink3) 22%,transparent);overflow:hidden}
.meter-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,#ff375f 55%,var(--accent)));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter-cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-top:-6px}
.rows{display:grid;gap:0;margin:0}
.rows>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:.5px solid color-mix(in srgb,var(--hair) 70%,transparent)}
.rows>div:first-child{border-top:0}
.rows dt{margin:0;font-size:13.5px;color:var(--ink3)}
.rows dd{margin:0;font-size:13.5px;font-weight:550;color:var(--ink);text-align:right}
.rows dd.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500}
.hint{margin-top:14px;font-size:12.5px;color:var(--ink3);text-align:center}
.hidden{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="wrap">
<header class="hero">
  <div class="hero-top">
    <div class="app-icon">◎</div>
    <div><h1 id="h1">5 小时自动开窗</h1><p class="sub" id="sub">Window Keeper · 只在空闲窗口发最小请求</p></div>
  </div>
  <div class="toolbar">
    <span id="session" class="pill">正在读取面板登录态…</span>
    <button id="check" class="btn primary">检查调度</button>
    <button id="reconnect" class="btn">重新读取登录态</button>
    <button id="manualToggle" class="btn hidden">手动输入密钥</button>
    <button id="lang" class="btn" title="语言 / Language">EN</button>
  </div>
  <div id="manual" class="manual hidden">
    <p id="manualHint">面板登录时勾选「记住密码」即可免输入；面板端已退出登录时需要重新登录。</p>
    <div class="row"><input id="key" type="password" placeholder="CPA 管理密钥（不是面板管理员密码）" autocomplete="off"><button id="connect" class="btn primary">连接</button><button id="disconnect" class="btn">停止刷新</button></div>
  </div>
  <div id="message" class="note"></div>
</header>
<div class="card summary" id="summary">尚未连接。首次安装默认 dry_run=true，仅观察，不发请求。开关与模型可在 CPA 插件设置中修改。</div>
<div id="accounts" class="accounts"></div>
<p class="hint" id="hint">不会提前重置官方限额，不会恢复手动禁用账号。</p>
</div>

    const reused=!!(secret&&secret===panelKey());
    setSession(reused?t('sessionReused'):t('sessionMemory'),reused?'':'plain');
    $('message').innerHTML=reused?'<small>'+t('msgReused')+'</small>':'';
    render(d);
    clearInterval(timer);timer=setInterval(load,30000);
  }catch(e){
    clearInterval(timer);
    if(e.message==='AUTH')showManual('<span class="warn">'+t('msgAuthLost')+'</span>');
    else $('message').innerHTML='<span class="warn">'+e.message+'</span>';
  }
}
function boot(){
  clearInterval(timer);
  secret=panelKey();
  if(secret){setSession(t('sessionReading'),'plain');load()}
  else showManual('<span class="warn">'+t('msgNoPanel')+'</span>');
}
$('check').onclick=async()=>{if(!secret)return;try{await api('check','POST');$('message').textContent=t('msgQueued');setTimeout(load,1500)}catch(e){$('message').innerHTML='<span class="warn">'+(e.message==='AUTH'?t('msgAuthRetry'):e.message)+'</span>'}};
$('connect').onclick=()=>{const v=$('key').value.trim();if(!v)return;secret=v;$('key').value='';$('manual').classList.add('hidden');$('manualToggle').classList.remove('hidden');load()};
$('disconnect').onclick=()=>{clearInterval(timer);secret='';last=null;$('manual').classList.add('hidden');$('accounts').replaceChildren();setSession(t('sessionStopped'),'plain');$('summary').textContent=t('msgStopped')};
$('reconnect').onclick=boot;
$('manualToggle').onclick=()=>showManual('');
/* Language: follow the panel; the toolbar button only overrides the current view. */
function applyLang(){applyStatic();if(secret)load();else if(last)render(last)}
$('lang').onclick=()=>{LANG=LANG==='en'?'zh':'en';applyLang()};
addEventListener('storage',e=>{if(e.key==='cli-proxy-auth')boot();else if(e.key==='cli-proxy-language'){LANG=detectLang();applyLang()}});
LANG=detectLang();applyStatic();boot();
</script></html>
